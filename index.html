<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espacio Maya | Melamina y Cancelería de Aluminio</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    :root {
      --madera: #7A4B26;
      --madera-oscuro: #5E381B;
      --grafito: #333333;
      --fondo-claro: #F8F7F5;
      --blanco: #FFFFFF;
      --gris-texto: #4A4A4A;
      --whatsapp: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--grafito);
      background-color: var(--blanco);
      line-height: 1.6;
    }

    /* Navegación */
    header {
      background-color: var(--blanco);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo img {
      height: 58px;
      width: auto;
      object-fit: contain;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--grafito);
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--madera);
    }

    /* Hero con Imagen de Fondo más visible */
    .hero {
      background-image: 
        linear-gradient(to bottom, rgba(255, 255, 255, 0.65), rgba(248, 247, 245, 0.72)),
        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 90px 20px;
      text-align: center;
      border-bottom: 3px solid var(--madera);
    }

    .hero-content-box {
      background-color: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(4px);
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .hero-logo {
      max-width: 210px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
    }

    .hero h1 {
      font-size: 2.3rem;
      color: var(--grafito);
      margin: 0 auto 14px;
      line-height: 1.25;
    }

    .hero h1 span {
      color: var(--madera);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--grafito);
      font-weight: 500;
      max-width: 640px;
      margin: 0 auto 28px;
    }

    .btn-primary {
      display: inline-block;
      background-color: var(--madera);
      color: var(--blanco);
      padding: 15px 32px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(122, 75, 38, 0.3);
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--madera-oscuro);
      transform: translateY(-2px);
    }

    /* Secciones generales */
    section {
      padding: 65px 20px;
      max-width: 1140px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      font-size: 1.9rem;
      color: var(--grafito);
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      color: var(--gris-texto);
      max-width: 640px;
      margin: 0 auto 45px;
    }

    /* Identidad */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--fondo-claro);
      padding: 28px;
      border-radius: 8px;
      border-top: 4px solid var(--madera);
    }

    .card h3 {
      color: var(--madera);
      margin-bottom: 10px;
      font-size: 1.25rem;
    }

    /* Servicios */
    .bg-alt {
      background-color: var(--fondo-claro);
      max-width: 100%;
    }

    .bg-alt-inner {
      max-width: 1140px;
      margin: 0 auto;
    }

    .service-card {
      background: var(--blanco);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-left: 5px solid var(--grafito);
    }

    .service-card.madera {
      border-left-color: var(--madera);
    }

    .service-card h3 {
      font-size: 1.35rem;
      margin-bottom: 12px;
      color: var(--grafito);
    }

    .service-card ul {
      margin-left: 20px;
      color: var(--gris-texto);
    }

    .service-card li {
      margin-bottom: 6px;
    }

    /* Galería / Catálogo */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      background: var(--fondo-claro);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #E2DFD9;
    }

    .gallery-placeholder {
      height: 210px;
      background-color: #E5E1D8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--grafito);
      font-weight: 600;
      padding: 20px;
      text-align: center;
    }

    .gallery-caption {
      padding: 16px;
    }

    .gallery-caption h4 {
      color: var(--grafito);
      margin-bottom: 4px;
    }

    .gallery-caption p {
      font-size: 0.9rem;
      color: var(--gris-texto);
    }

    /* Cotizador y Ubicación */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
      align-items: stretch;
    }

    .quote-box, .map-box {
      background: var(--blanco);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      border-top: 4px solid var(--madera);
    }

    .quote-box h3, .map-box h3 {
      color: var(--grafito);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .quote-box p, .map-box p {
      color: var(--gris-texto);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--grafito);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #CCCCCC;
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--grafito);
      background-color: #FAFAFA;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--madera);
      background-color: var(--blanco);
    }

    .map-frame {
      width: 100%;
      height: 290px;
      border: 0;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .address-details {
      font-size: 0.92rem;
      color: var(--grafito);
      line-height: 1.7;
    }

    /* Footer */
    footer {
      background-color: var(--grafito);
      color: var(--blanco);
      text-align: center;
      padding: 45px 20px;
    }

      background: var(--blanco);
      display:
